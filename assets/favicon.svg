<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <!-- Outer Ring Gradient -->
    <linearGradient id="ringHighlight" x1="40" y1="20" x2="200" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Inner Document Gradient -->
    <linearGradient id="docGrad" x1="50" y1="40" x2="190" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f7ff"/>
    </linearGradient>

    <!-- Folded Corner Gradient -->
    <linearGradient id="foldGrad" x1="145" y1="45" x2="185" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Magnifying Glass Rim Gradient -->
    <linearGradient id="lensRim" x1="115" y1="105" x2="195" y2="185" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowPaper" x="45" y="25" width="155" height="190" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
    <filter id="shadowLens" x="90" y="85" width="135" height="145" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 1. Outer Vibrant Blue Ring -->
  <circle cx="120" cy="120" r="104" stroke="url(#ringHighlight)" stroke-width="12" fill="none"/>
  <!-- Subtle inner edge shadow -->
  <circle cx="120" cy="120" r="97.5" stroke="#034d82" stroke-width="1.5" fill="none" opacity="0.35"/>

  <!-- 2. Resume Document Sheet -->
  <g filter="url(#shadowPaper)">
    <!-- Document Body with folded corner -->
    <path d="M64 50 
             C64 41 71 34 80 34 
             L148 34 
             L182 68 
             L182 186 
             C182 195 175 202 166 202 
             L80 202 
             C71 202 64 195 64 186 
             Z" 
          fill="url(#docGrad)" stroke="#d0e2f5" stroke-width="2"/>

    <!-- Folded Corner Flap -->
    <path d="M148 34 
             L148 60 
             C148 64.5 151.5 68 156 68 
             L182 68 
             Z" 
          fill="url(#foldGrad)"/>
  </g>

  <!-- Avatar Profile Icon -->
  <circle cx="96" cy="83" r="14.5" fill="#0284c7"/>
  <path d="M78 120 C78 103 85 98 96 98 C107 98 114 103 114 120 Z" fill="#0284c7"/>

  <!-- Header Bars next to Avatar -->
  <rect x="122" y="76" width="32" height="7.5" rx="3.75" fill="#0284c7"/>
  <rect x="122" y="92" width="48" height="7.5" rx="3.75" fill="#0284c7"/>

  <!-- Resume Section Lines -->
  <rect x="75" y="132" width="70" height="7.5" rx="3.75" fill="#5b708b"/>
  <rect x="75" y="147" width="60" height="7.5" rx="3.75" fill="#5b708b"/>
  <rect x="75" y="162" width="52" height="7.5" rx="3.75" fill="#5b708b"/>
  <rect x="75" y="177" width="62" height="7.5" rx="3.75" fill="#5b708b"/>

  <!-- 3. Magnifying Glass with Checkmark -->
  <g filter="url(#shadowLens)">
    <!-- Handle -->
    <path d="M173 167 L204 198" stroke="#0284c7" stroke-width="16" stroke-linecap="round"/>
    <path d="M173 167 L204 198" stroke="#0369a1" stroke-width="16" stroke-linecap="round" opacity="0.35"/>
    <path d="M174 166 L203 195" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>

    <!-- Lens Rim -->
    <circle cx="147" cy="141" r="39" stroke="url(#lensRim)" stroke-width="10" fill="none"/>
    
    <!-- Dark Blue Lens Center -->
    <circle cx="147" cy="141" r="33.5" fill="#0a192f"/>

    <!-- Bright White Checkmark -->
    <path d="M133 141 L143 151 L163 131" 
          stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>