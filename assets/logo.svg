<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="rrBgGrad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="65%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Dynamic Accent Gradient -->
    <linearGradient id="rrAccentGrad" x1="50" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="rrShadow" x="18" y="16" width="84" height="92" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Emblem Container -->
  <rect width="120" height="120" rx="26" fill="url(#rrBgGrad)"/>
  <rect x="1" y="1" width="118" height="118" rx="25" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2" fill="none"/>

  <!-- Geometric Monogram "R" -->
  <g filter="url(#rrShadow)">
    <path fill-rule="evenodd" clip-rule="evenodd"
          d="M32 26 H68 C82.36 26 94 36.75 94 50 C94 60.5 87.2 69.4 77.6 72.7 L94 94 H73 L58.4 74 H48 V94 H32 V26 Z M48 42 V58 H66 C70.4 58 74 54.4 74 50 C74 45.6 70.4 42 66 42 H48 Z"
          fill="#ffffff"/>
    
    <!-- Precision Dynamic Kick Accent -->
    <path d="M72 74 L89 94 H76 L63 74 H72 Z" fill="url(#rrAccentGrad)"/>
  </g>

  <!-- Precision Diagnostic Dot -->
  <circle cx="86" cy="35" r="4" fill="#38bdf8"/>
</svg>